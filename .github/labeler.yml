"Изменения: Спрайты":
- changed-files:
  - any-glob-to-any-file: '**/*.rsi/*.png'

"Изменения: Карта":
- changed-files:
  - any-glob-to-any-file:
    - 'Resources/Maps/**/*.yml'
    - 'Resources/Prototypes/Maps/**/*.yml'

"Изменения: UI":
- changed-files:
  - any-glob-to-any-file: '**/*.xaml*'

"Изменения: Шейдеры":
- changed-files:
  - any-glob-to-any-file: '**/*.swsl'

"Изменения: Аудио":
- changed-files:
  - any-glob-to-any-file: '**/*.ogg'

"Изменения: Нету C#":
- changed-files:
  # Equiv to any-glob-to-all as long as this has one matcher. If ALL changed files are not C# files, then apply label.
  - all-globs-to-all-files: "!**/*.cs"

"Изменения: Есть C#":
- changed-files:
  - any-glob-to-any-file: '**/*.cs'

"Изменения: Прототипы":
- changed-files:
  - any-glob-to-any-file: 'Resources/Prototypes/**/*.yml'

#Starlight exclusive label
"Изменения: Гайдбуки":
- changed-files:
  - any-glob-to-any-file:
    - 'Resources/ServerInfo/**/*.xml'
    - 'Resources/Prototypes/Guidebook/**/*.yml'
    - 'Resources/Prototypes/*/Guidebook/**/*.xml'