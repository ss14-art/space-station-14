    useDelay: 30
    icon:
      sprite: Interface/Actions/devour.rsi
      state: icon
  - type: TargetAction
    range: 1.5
  - type: EntityTargetAction
    event: !type:MatterEaterActionEvent

- type: entity
  parent: BaseAction
  id: ActionGeneticJumpy
  name: Прыгучесть
