  - type: SurgeryPartCondition
    parts:
    - Head
  - type: SurgeryOrganExistCondition
    organ:
    - type: ShadowlingThrallTumor
    container: brain_implant
  - type: Sprite
    sprite: Objects/Tools/flashlight.rsi
    state: flashlight
